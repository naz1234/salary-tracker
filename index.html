<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#eef7e8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Salary Tracker" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      try {
        if (localStorage.getItem("salary-tracker-theme") === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#12281f");
          document
            .querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
            .setAttribute("content", "black-translucent");
        }
      } catch (error) {
        console.warn("Unable to restore the saved theme", error);
      }
    </script>
    <link rel="manifest" href="/manifest.webmanifest?v=pika-theme-20260828" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png?v=pika-salary-20260828" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png?v=pika-salary-20260828" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png?v=pika-salary-20260828" />
    <title>Salary Cycle Tracker</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      html {
        --startup-background: #eef7e8;
        --startup-card: #fffcf4;
        --startup-text: #1b3045;
        --startup-muted: #536858;
        --startup-border: #c5d8bd;
        background: var(--startup-background);
      }

      html.dark {
        --startup-background: #12281f;
        --startup-card: #1b382c;
        --startup-text: #f9f5e9;
        --startup-muted: #b3c5b2;
        --startup-border: #496552;
      }

      #root:empty::before {
        content: "Loading Salary Tracker...";
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--startup-muted);
        background: var(--startup-background);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener(
        "error",
        function (event) {
          var target = event.target;
          if (!target || target.tagName !== "SCRIPT") return;

          var root = document.getElementById("root");
          if (!root || root.children.length > 0) return;

          root.innerHTML =
            '<div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--startup-background);padding:16px;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:var(--startup-text);text-align:center;">' +
            '<div style="max-width:360px;border:1px solid var(--startup-border);background:var(--startup-card);border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(27,56,44,.08);">' +
            '<div style="font-size:18px;font-weight:700;margin-bottom:8px;">App did not load</div>' +
            '<div style="font-size:14px;color:var(--startup-muted);line-height:1.45;">Please refresh once. The previous cached file may still be open in this browser.</div>' +
            '<button onclick="window.location.reload()" style="margin-top:16px;border:0;border-radius:14px;background:#216d3d;color:white;padding:12px 18px;font-weight:700;">Refresh</button>' +
            "</div></div>";
        },
        true
      );
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
